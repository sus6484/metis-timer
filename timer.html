<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Metis — 타이머</title>
    <link rel="stylesheet" href="styles.css?v=20260820a" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --pink: #ccff00;
        --cyan: #38bdf8;
        --text: #fff;
        --muted: #94a3b8;
        --timer-design-w: 1920px;
        --timer-design-h: 1080px;
        --timer-layout-max: 1920px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        touch-action: manipulation;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        max-width: 100%;
      }
      /* 레터박스: 남는 여백은 검은색, 스테이지는 중앙 */
      body {
        min-height: 100%;
        background: #000;
        color: var(--text);
        font-family: Pretendard, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        position: relative;
        overflow: hidden;
        width: 100%;
      }
      /* 기준 해상도 1920×1080 — 창 크기에 따라 transform: scale() 로만 축소/확대 */
      .timer-stage {
        width: var(--timer-design-w);
        height: var(--timer-design-h);
        position: absolute;
        left: 50%;
        top: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        transform-origin: center center;
        background-color: var(--bg);
        background-image: url("image/background2.png");
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        transform: translate(-50%, -50%);
        will-change: transform;
      }
      .timer-stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        pointer-events: none;
        z-index: 0;
      }
      .timer-stage > * {
        z-index: 1;
      }
      .timer-stage > .timer-page-header,
      .timer-stage > .outer-layout,
      .timer-stage > .break-top-bar {
        position: relative;
      }
      .timer-page-header {
        width: 100%;
        max-width: var(--timer-layout-max);
        margin: 0 auto 2px;
        padding: 8px 8px 0;
        text-align: center;
        flex-shrink: 0;
      }
      .timer-tournament-title {
        margin: 0;
        color: var(--pink);
        text-shadow: 0 0 8px rgba(204, 255, 0, 0.45), 0 0 20px rgba(204, 255, 0, 0.25);
        font-size: 2.85rem;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.02em;
        white-space: pre-wrap;
        text-align: center;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .timer-header-logo {
        width: 72px;
        max-width: 100%;
        height: auto;
        display: block;
        margin: 18px auto 4px;
        opacity: 0.82;
      }
      .outer-layout {
        flex: 1;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        justify-content: space-between;
        width: 100%;
        max-width: var(--timer-layout-max);
        gap: 28px;
        flex-wrap: nowrap;
        margin: 0 auto;
        min-height: 0;
        overflow: hidden;
        padding: 0 24px 24px;
      }
      .stage-left {
        flex: 0 0 340px;
        min-width: 340px;
        max-width: 340px;
        min-height: 0;
        padding: 6px 16px 8px 34px;
        border-right: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-self: stretch;
        text-align: left;
        overflow: hidden;
      }
      .left-carousel {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
        overflow: hidden;
      }
      .left-carousel.is-rotating {
        position: relative;
        justify-content: flex-start;
        gap: 0;
      }
      .left-carousel.is-rotating .left-panel-block {
        display: none;
      }
      .left-carousel.is-rotating.is-view-meta {
        justify-content: center;
        gap: 18px;
      }
      .left-carousel.is-rotating.is-view-meta .left-panel-block--info,
      .left-carousel.is-rotating.is-view-meta .left-panel-block--total {
        display: block;
      }
      .left-carousel.is-rotating.is-view-prize .left-panel-block--prize {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        flex-direction: column;
      }
      .left-carousel.is-rotating.is-view-prize .prize-wrap {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .left-carousel.is-rotating.is-view-prize .prize-val {
        flex: 1 1 auto;
        min-height: 0;
        overflow-x: visible;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
      }
      .left-carousel.is-rotating.is-view-prize .prize-val::-webkit-scrollbar {
        width: 4px;
      }
      .left-carousel.is-rotating.is-view-prize .prize-val::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 4px;
      }
      .info-wrap,
      .prize-wrap,
      .total-prize-wrap {
        margin: 0;
      }
      .left-lab {
        display: block;
        font-size: 1.44rem;
        letter-spacing: 0.2304rem;
        color: var(--pink);
        font-weight: 700;
        margin-bottom: 8px;
      }
      .total-prize-value {
        --ls: var(--prize-font-scale, var(--left-font-scale, 1));
        margin: 0;
        color: var(--pink);
        font-size: calc(1.85rem * var(--ls));
        font-weight: 800;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 8px rgba(204, 255, 0, 0.35);
        word-break: break-word;
      }
      .left-lab-margin {
        margin-top: 18px;
      }
      .prize-val {
        --ls: var(--prize-font-scale, var(--left-font-scale, 1));
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: none;
        overflow-x: visible;
        overflow-y: hidden;
        padding-right: 0;
        font-size: calc(1rem * var(--ls));
        line-height: 1.35;
        color: var(--text);
      }
      .prize-item {
        display: flex;
        align-items: baseline;
        justify-content: flex-start;
        gap: 10px;
        min-width: 0;
        white-space: normal;
        word-break: break-word;
      }
      .prize-rank {
        flex: 0 0 auto;
        color: #e5e7eb;
        font-weight: 700;
        font-size: calc(1.15rem * var(--ls));
        letter-spacing: 0.02em;
      }
      .prize-amount {
        display: inline-flex;
        align-items: baseline;
        justify-content: flex-end;
        flex: 0 1 auto;
        flex-wrap: wrap;
        gap: 4px;
        min-width: 0;
        max-width: 100%;
        color: #ffffff;
        font-weight: 700;
        font-size: calc(1.22rem * var(--ls));
        font-variant-numeric: tabular-nums;
        margin-left: auto;
      }
      .prize-amount-value {
        min-width: 0;
      }
      .prize-extra {
        flex-shrink: 0;
        color: inherit;
        font-weight: inherit;
        font-size: inherit;
        white-space: nowrap;
      }
      .prize-item--top .prize-rank {
        color: var(--pink);
        font-size: calc(1.4rem * var(--ls));
      }
      .prize-item--top .prize-amount {
        color: #f5ffd1;
        font-size: calc(1.75rem * var(--ls));
        text-shadow: 0 0 8px rgba(204, 255, 0, 0.28);
      }
      .tourney-info {
        --ls: var(--info-font-scale, var(--left-font-scale, 1));
        margin: 0;
        font-size: calc(1.75rem * var(--ls));
        line-height: 1.45;
        font-weight: 700;
        color: #f5ffd1;
        text-shadow: 0 0 8px rgba(204, 255, 0, 0.28);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .tap-root {
        flex: 1 1 0%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        cursor: pointer;
        border-radius: 12px;
        outline: none;
        transition: background 0.15s;
        padding: 0;
      }
      .tap-root:hover {
        background: rgba(255, 45, 165, 0.04);
      }
      .tap-root:focus-visible {
        box-shadow: 0 0 0 2px var(--pink);
      }
      .tap-inner {
        flex: 1 1 auto;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        justify-content: space-between;
        gap: 36px;
        width: 100%;
        min-height: 0;
        flex-wrap: nowrap;
      }
      .stage-main {
        flex: 1 1 0%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 12px;
        text-align: center;
      }
      .normal-stage-main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        text-align: center;
      }
      .stage-side {
        flex: 0 0 290px;
        min-width: 290px;
        border-left: 1px solid rgba(255, 255, 255, 0.12);
        padding-left: 34px;
        padding-right: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
        text-align: left;
      }
      @supports not (backdrop-filter: blur(1px)) {
        .timer-pause-overlay {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: rgba(50, 0, 0, 0.55);
        }
      }
      .tap-hint {
        box-sizing: border-box;
        width: 100%;
        max-width: min(36rem, 100%);
        margin-inline: auto;
        font-size: 0.72rem;
        color: #64748b;
        margin-top: 16px;
        letter-spacing: 0.04em;
        text-align: center;
      }
      .level {
        width: 100%;
        margin: 28px 0 12px;
        margin-inline: 0;
        text-align: center;
        color: var(--pink);
        font-size: 2.2rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        line-height: 1.1;
      }
      .clock {
        font-size: 21rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        margin: 0 0 22px;
        line-height: 1;
        text-align: center;
      }
      .blinds {
        width: 100%;
        text-align: center;
        margin-bottom: 20px;
        font-size: 3.1rem;
        font-weight: 700;
        line-height: 1.35;
      }
      .blinds span.lab {
        color: var(--pink);
        font-size: inherit;
        letter-spacing: 0.1em;
        margin-right: 8px;
      }
      .next-level {
        box-sizing: border-box;
        width: 100%;
        max-width: 52rem;
        padding-inline: 8px;
        margin-inline: auto;
        text-align: center;
        font-size: 2.5rem;
        font-weight: 600;
        color: var(--muted);
        margin-top: 12px;
        line-height: 1.4;
      }
      .next-level strong {
        color: var(--cyan);
      }
      .break-top-bar {
        width: 100%;
        max-width: var(--timer-layout-max);
        min-width: 0;
        margin: 0 auto 10px;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px 20px;
        flex-wrap: wrap;
        text-align: center;
        background: rgba(180, 83, 79, 0.18);
        border: 1px solid rgba(180, 83, 79, 0.45);
        border-radius: 12px;
        flex-shrink: 0;
      }
      .break-top-bar.is-hidden {
        display: none;
      }
      .break-top-meta {
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        color: #f87171;
        font-weight: 700;
        flex-shrink: 0;
      }
      .break-top-main {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px 16px;
        min-width: 0;
        max-width: 100%;
        text-align: center;
      }
      .break-top-clock {
        font-size: 3.5rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--cyan);
        line-height: 1;
        flex-shrink: 0;
      }
      .break-top-sep {
        color: rgba(248, 113, 113, 0.65);
        font-size: 2.4rem;
        font-weight: 700;
        line-height: 1;
        flex-shrink: 0;
      }
      .break-top-sep.is-hidden,
      .break-top-next.is-hidden {
        display: none;
      }
      .break-top-next {
        color: var(--muted);
        font-size: 2.5rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        line-height: 1.15;
        min-width: 0;
        max-width: 100%;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      .break-top-next strong {
        color: var(--cyan);
        font-weight: 800;
      }
      .break-video-stage {
        box-sizing: border-box;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 520px;
        padding: 8px 4px;
      }
      .break-video-stage.is-hidden {
        display: none;
      }
      .break-video-stage video {
        box-sizing: border-box;
        width: auto;
        height: auto;
        max-width: 100%;
        min-width: 0;
        max-height: 720px;
        object-fit: contain;
        border-radius: 10px;
        background: #0a0a0a;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
      }
      .normal-stage-main.is-hidden {
        display: none;
      }
      .metric-label {
        display: block;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        color: var(--pink);
        margin-bottom: 6px;
      }
      .metric-val {
        font-size: 3.6rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .metric-val--sidebar {
        font-size: 2.35rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: #d4d4d8;
        letter-spacing: 0.02em;
      }
      .metric--avgstack {
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-start;
        gap: 2px;
      }
      .metric--avgstack .metric-val {
        display: block;
        line-height: 1.15;
        white-space: nowrap;
      }
      .metric-val-bb {
        display: block !important;
        margin-top: 0;
        color: var(--pink);
        text-shadow: 0 0 8px rgba(204, 255, 0, 0.28);
        font-size: 1.55rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.2;
        white-space: nowrap;
      }
      .metric-val--mono {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      .metric-val--placeholder {
        opacity: 0.4;
      }
      .metric-label--break {
        color: #b45353;
      }
      .quick-zone {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 92px;
        z-index: 99999 !important;
        pointer-events: none;
      }
      .quick-panel {
        position: absolute;
        left: 50%;
        bottom: 8px;
        transform: translate(-50%, 52%);
        transition: transform 0.22s ease, opacity 0.22s ease;
        opacity: 0.56;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 8px 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        max-width: 1120px;
        width: max-content;
        z-index: 99999 !important;
        pointer-events: auto;
      }
      .quick-panel.is-visible {
        transform: translate(-50%, 0);
        opacity: 1;
      }
      .quick-panel-group {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 4px 6px;
      }
      .quick-panel-label {
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        color: #cbd5e1;
        margin-right: 2px;
        white-space: nowrap;
      }
      .quick-btn {
        min-width: 30px;
        height: 28px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #1f2937;
        color: #f8fafc;
        font-weight: 700;
        font-size: 0.92rem;
        line-height: 1;
        cursor: pointer;
      }
      .quick-btn:hover {
        filter: brightness(1.1);
      }
      .quick-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .quick-panel-group--transport {
        flex-wrap: nowrap;
        gap: 6px;
        padding-left: 8px;
        padding-right: 8px;
      }
      .quick-btn--start {
        background: #16a34a;
        min-width: 58px;
      }
      /* 관리자 일시정지(.btn-timer-action.gray)와 동일 톤 */
      .quick-btn--pause {
        background: #4b4b5a;
        color: #f0f0f5;
        border-color: rgba(255, 255, 255, 0.22);
        min-width: 58px;
      }
      .quick-btn--end {
        background: #dc2626;
        min-width: 58px;
      }
      .cloud-sync-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 60;
        pointer-events: none;
        backdrop-filter: blur(6px);
        background: rgba(0, 0, 0, 0.55);
      }
      .timer-stage .timer-pause-overlay {
        position: absolute;
      }
      .timer-stage .timer-pause-overlay-label {
        font-size: 12rem;
      }
    </style>
  </head>
  <body>
    <div id="timer-stage" class="timer-stage">
    <div
      id="cloud-sync-badge"
      class="cloud-sync-badge"
      data-state="idle"
      aria-live="polite"
      title="클라우드 동기화"
    >
      <span class="cloud-sync-dot" aria-hidden="true"></span>
      <span class="cloud-sync-label">대기</span>
    </div>
    <div id="pause-overlay" class="timer-pause-overlay" aria-hidden="true">
      <div class="timer-pause-overlay-label" aria-live="polite">Ⅱ PAUSED</div>
    </div>
    <div id="break-top-bar" class="break-top-bar is-hidden" aria-live="polite">
      <span class="break-top-meta">쉬는 시간 · 남은 시간</span>
      <div class="break-top-main">
        <span id="break-remaining-top" class="break-top-clock">00:00</span>
        <span id="break-next-sep" class="break-top-sep is-hidden" aria-hidden="true">|</span>
        <span id="break-next-level" class="break-top-next is-hidden"></span>
      </div>
    </div>
    <header class="timer-page-header">
      <h1 class="timer-tournament-title" id="el-title">토너먼트</h1>
    </header>
    <div class="outer-layout">
      <aside class="stage-left" id="stage-left" aria-label="상금 및 대회 정보">
        <div class="left-carousel is-view-meta" id="left-carousel">
          <div class="left-panel-block left-panel-block--info info-wrap">
            <span class="left-lab">INFO</span>
            <p class="tourney-info" id="el-tourney-info">—</p>
          </div>
          <div class="left-panel-block left-panel-block--prize prize-wrap">
            <span class="left-lab">PRIZE POOL</span>
            <div class="prize-val" id="el-prize">—</div>
          </div>
          <div class="left-panel-block left-panel-block--total total-prize-wrap">
            <span class="left-lab">TOTAL PRIZE</span>
            <p class="total-prize-value" id="el-total-prize">—</p>
          </div>
        </div>
      </aside>

      <div
        id="tap-root"
        class="tap-root"
        role="button"
        tabindex="0"
        aria-label="클릭하여 일시정지 또는 이어서 시작"
      >
        <div class="tap-inner">
          <div class="stage-main">
            <div id="break-video-stage" class="break-video-stage is-hidden" aria-hidden="true">
              <video
                id="break-video"
                playsinline
                controls
                preload="metadata"
                autoplay
              ></video>
            </div>
            <div id="normal-stage-main" class="normal-stage-main">
              <img class="timer-header-logo" src="image/logo.png" alt="Metis logo" />
              <p class="level" id="el-level">LEVEL —</p>
              <div class="clock" id="el-clock">00:00</div>
              <div class="blinds" id="el-blinds"></div>
              <div class="next-level" id="el-next"></div>
              <p class="tap-hint">클릭 · 스페이스: 일시정지 / 이어서 시작</p>
            </div>
          </div>
          <aside class="stage-side" id="el-side" aria-live="polite" aria-label="토너먼트 통계">
            <div class="metric">
              <span class="metric-label">PLAYERS</span>
              <span class="metric-val metric-val--sidebar" id="el-m-players">0 / 0</span>
            </div>
            <div class="metric">
              <span class="metric-label">REG CLOSE</span>
              <span class="metric-val metric-val--sidebar metric-val--mono" id="el-m-regclose">—</span>
            </div>
            <div class="metric">
              <span class="metric-label">TOTAL STACK</span>
              <span class="metric-val metric-val--sidebar" id="el-m-total">0</span>
            </div>
            <div class="metric metric--avgstack">

    <script>
      (function () {

    <script>
      (function () {
        function runTimerPage() {
        window.__METIS_IS_TIMER_PAGE = true;
        if (
          window.MetisTimer &&
          MetisTimer.setSyncPresetId &&
          window.__METIS_TIMER_PRESET_ID
        ) {
          MetisTimer.setSyncPresetId(String(window.__METIS_TIMER_PRESET_ID));
        }

        function $(id) {
          return document.getElementById(id);
        }

        /** 단일 타이머 루프에서 동일 값이면 DOM 스킵 (불필요 리페인트 방지) */
        var lastUi = {};
        var lastPausedOverlay = null;
        var lastHeartbeatAt = 0;
        /** 엔진·오디오·화면을 한 루프에서 처리 (남은 시간·TOTAL·REG·NEXT BREAK 동시 갱신) */
        var MAIN_TICK_MS = 200;

        function textIf(id, text) {
          var v = String(text);
          if (lastUi[id] === v) return;
          lastUi[id] = v;
          var el = $(id);
          if (el) el.textContent = v;
        }

        function htmlIf(id, html) {
          var v = String(html);
          if (lastUi[id] === v) return;
          lastUi[id] = v;
          var el = $(id);
          if (el) el.innerHTML = v;
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function formatPrizeAmount(n) {
          var value = Math.max(0, Math.floor(Number(n) || 0));
          return value.toLocaleString("ko-KR");
        }

        function parsePrizeAmountNumber(rawAmount) {
          if (typeof rawAmount === "number") {
            return Math.max(0, Math.floor(Number.isFinite(rawAmount) ? rawAmount : 0));
          }
          var digits = String(rawAmount == null ? "" : rawAmount).replace(/\D/g, "");
          if (!digits) return 0;
          return Math.max(0, Math.floor(Number(digits) || 0));
        }

        function normalizePrizeItems(s) {
          if (!s || !Array.isArray(s.prizeItems)) return [];
          return s.prizeItems
            .map(function (item) {
              if (!item || typeof item !== "object") return null;
              var rank = String(item.rank != null ? item.rank : "").trim().slice(0, 24);
              var amount = parsePrizeAmountNumber(item.amount);
              var extraPrize = String(item.extraPrize != null ? item.extraPrize : "").trim();
              // 기본 금액이 0이어도 extraPrize가 있으면 해당 등수 유지
              if (!rank || !(amount > 0 || extraPrize)) return null;
              return { rank: rank, amount: amount, extraPrize: extraPrize };
            })
            .filter(Boolean);
        }

        function displayPrizeBlockHtml(s) {
          var items = normalizePrizeItems(s);
          if (items.length) {
            return items
              .map(function (item, idx) {
                var topClass = idx < 3 ? " prize-item--top" : "";
                var extra = item.extraPrize ? String(item.extraPrize).trim() : "";
                var hasAmount = item.amount > 0;
                var amountHtml = hasAmount
                  ? '<span class="prize-amount-value">' +
                    escapeHtml(formatPrizeAmount(item.amount)) +
                    "</span>"
                  : "";
                // 추가 보상은 금액 유무와 무관하게 DOM에 삽입
                var extraHtml = extra
                  ? '<span class="prize-extra">' + escapeHtml(extra) + "</span>"
                  : "";
                if (!amountHtml && !extraHtml) return "";
                return (
                  '<div class="prize-item' +
                  topClass +
                  '">' +
                  '<span class="prize-rank">' +
                  escapeHtml(item.rank) +
                  "</span>" +
                  '<span class="prize-amount">' +
                  amountHtml +
                  extraHtml +
                  "</span>" +
                  "</div>"
                );
              })
              .filter(Boolean)
              .join("");
          }
          var raw =
            s.prizeText != null && String(s.prizeText).length
              ? String(s.prizeText).trim()
              : "";
          if (raw) return escapeHtml(raw).replace(/\n/g, "<br />");
          if (s.guaranteedPrize != null) {
            var n = Math.floor(Number(s.guaranteedPrize) || 0);
            if (n > 0) return formatPrizeAmount(n);
          }
          return "—";
        }

        function displayTotalPrize(s) {
          var raw =
            s.totalPrizeText != null && String(s.totalPrizeText).length
              ? String(s.totalPrizeText).trim()
              : "";
          if (!raw) return "—";
          if (/^\d+$/.test(raw)) return Number(raw).toLocaleString("ko-KR");
          if (/^\d[\d,\s]*$/.test(raw)) {
            var n = Number(raw.replace(/[,\s]/g, ""));
            if (Number.isFinite(n)) return Math.floor(n).toLocaleString("ko-KR");
          }
          return raw;
        }

        var LEFT_CAROUSEL_MS = 5000;
        var leftCarouselIdx = 0;
        var leftCarouselTimer = null;
        var leftCarouselRotating = false;

        function hasPrizePoolContent(s) {
          if (normalizePrizeItems(s).length) return true;
          var raw =
            s.prizeText != null && String(s.prizeText).length
              ? String(s.prizeText).trim()
              : "";
          if (raw) return true;
          if (s.guaranteedPrize != null) {
            var n = Math.floor(Number(s.guaranteedPrize) || 0);
            if (n > 0) return true;
          }
          return false;
        }

        function setLeftCarouselView(view) {
          var carousel = $("left-carousel");
          if (!carousel) return;
          carousel.classList.toggle("is-view-meta", view === "meta");
          carousel.classList.toggle("is-view-prize", view === "prize");
          leftCarouselIdx = view === "prize" ? 1 : 0;
        }

        function stopLeftCarousel() {
          if (leftCarouselTimer) {
            clearInterval(leftCarouselTimer);
            leftCarouselTimer = null;
          }
        }

        function startLeftCarousel() {
          stopLeftCarousel();
          leftCarouselTimer = setInterval(function () {
            setLeftCarouselView(leftCarouselIdx === 0 ? "prize" : "meta");
          }, LEFT_CAROUSEL_MS);
        }

        function syncLeftCarousel(s) {
          var carousel = $("left-carousel");
          if (!carousel) return;
          var shouldRotate = !!s.leftPanelRotate && hasPrizePoolContent(s);
          if (shouldRotate !== leftCarouselRotating) {
            leftCarouselRotating = shouldRotate;
            carousel.classList.toggle("is-rotating", shouldRotate);
            if (!shouldRotate) {
              stopLeftCarousel();
              carousel.classList.remove("is-view-prize");
              carousel.classList.add("is-view-meta");
              leftCarouselIdx = 0;
            } else {
              setLeftCarouselView("meta");
              startLeftCarousel();
            }
          }
        }

        /** 브레이크 타임 랜덤 영상 풀 — ./video/ 상대 경로, ended 시 다음 랜덤으로 무한 반복 */
        var BREAK_VIDEO_POOL = [
          "./video/0103.mp4",
          "./video/0105.mp4",
          "./video/0121.mp4",
          "./video/0207.mp4",
          "./video/0318.mp4",
          "./video/02232.mp4",
        ];

        var lastPlayedBreakVideo = null;
        var breakVideoSessionActive = false;
        var wasBreakUiActive = false;
        var breakLastTimerRun = false;
        var breakVideoAudioApplied = false;

        function pickRandomBreakVideo(excludeSrc) {
          var ex = excludeSrc ? String(excludeSrc) : "";
          var candidates = BREAK_VIDEO_POOL.filter(function (p) {
            return p !== ex;
          });
          if (candidates.length === 0) candidates = BREAK_VIDEO_POOL.slice();
          return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function onBreakVideoEnded() {
          if (!breakVideoSessionActive) return;
          var vid = $("break-video");
          if (!vid) return;
          var s = MetisTimer.readSyncState();
          if (!s || !s.timer) return;
          var tn = MetisTimer.normalizeTimer(s.timer, s);
          var levels = MetisTimer.getActiveLevels(s);
          var row = levels && levels[tn.levelIndex];
          if (
            !tn.isRunning ||
            tn.bridge ||
            !row ||
            !MetisTimer.isBreakRow(row)
          ) {
            return;
          }
          var exclude = (vid.dataset.metisSrc && String(vid.dataset.metisSrc)) || "";
          var next = pickRandomBreakVideo(exclude);
          lastPlayedBreakVideo = next;
          vid.dataset.metisSrc = next;
          vid.src = next;
          vid.load();
          playBreakVideo(vid);
        }

        function nextPlayLevelAfter(levels, fromIdx) {
          if (!levels) return null;
          for (var i = fromIdx + 1; i < levels.length; i++) {
            if (levels[i] && !MetisTimer.isBreakRow(levels[i])) {
              return { row: levels[i], index: i };
            }
          }
          return null;
        }

        function formatBreakNextLevelHtml(levels, currentIdx) {
          var next = nextPlayLevelAfter(levels, currentIdx);
          if (!next) return "";
          var row = next.row;
          return (
            "<strong>NEXT LEVEL " +
            MetisTimer.playLevelsCountUpTo(levels, next.index) +
            "</strong> — " +
            row.sb +
            "/" +
            row.bb +
            " (" +
            (row.ante != null ? row.ante : 0) +
            ")"
          );
        }

        function setBreakNextLevelVisible(visible, html) {
          var nextEl = $("break-next-level");
          var sepEl = $("break-next-sep");
          var label = visible && html ? html : "";
          htmlIf("break-next-level", label);
          if (nextEl) nextEl.classList.toggle("is-hidden", !label);
          if (sepEl) sepEl.classList.toggle("is-hidden", !label);
        }

        function syncBreakUi(onBreak, breakRow, rem, timerRunning, levels, levelIndex) {
          var topBar = $("break-top-bar");
          var vidStage = $("break-video-stage");
          var norm = $("normal-stage-main");
          var vid = $("break-video");
          if (!topBar || !vidStage || !norm || !vid) return;
          if (onBreak && breakRow) {
            topBar.classList.remove("is-hidden");
            vidStage.classList.remove("is-hidden");
            vidStage.setAttribute("aria-hidden", "false");
            norm.classList.add("is-hidden");
            textIf("break-remaining-top", MetisTimer.formatMMSS(rem));
            setBreakNextLevelVisible(true, formatBreakNextLevelHtml(levels, levelIndex));
            bindBreakVideoVolumeControls(vid);

            if (!wasBreakUiActive) {
              breakVideoSessionActive = true;
              var src = pickRandomBreakVideo(lastPlayedBreakVideo);
              lastPlayedBreakVideo = src;
              vid.dataset.metisSrc = src;
              vid.src = src;
              vid.load();
              if (!vid.dataset.metisBreakEndedBound) {
                vid.dataset.metisBreakEndedBound = "1";
                vid.addEventListener("ended", onBreakVideoEnded);
              }
            }

            if (timerRunning) {
              if (!wasBreakUiActive || !breakLastTimerRun) {
                playBreakVideo(vid);
              }
            } else {
              try {
                vid.pause();
              } catch (e2) {}
            }
            breakLastTimerRun = !!timerRunning;
            wasBreakUiActive = true;
          } else {
            breakVideoSessionActive = false;
            wasBreakUiActive = false;
            breakLastTimerRun = false;
            topBar.classList.add("is-hidden");
            setBreakNextLevelVisible(false, "");
            vidStage.classList.add("is-hidden");
            vidStage.setAttribute("aria-hidden", "true");
            norm.classList.remove("is-hidden");
            breakVideoAudioApplied = false;
            try {
              vid.pause();
              vid.removeAttribute("src");
              vid.load();
            } catch (e1) {}
            vid.dataset.metisSrc = "";
          }
        }

        function firstPlayLevelRow(levels) {
          if (!levels || !levels.length) return null;
          for (var i = 0; i < levels.length; i++) {
            if (!MetisTimer.isBreakRow(levels[i])) return levels[i];
          }
          return null;
        }

        function formatCountdownHMS(endMs, now) {
          if (endMs == null || !Number.isFinite(Number(endMs))) return "—";
          var sec = Math.max(0, Math.floor((Number(endMs) - now) / 1000));
          var h = Math.floor(sec / 3600);
          var m = Math.floor((sec % 3600) / 60);
          var secR = sec % 60;
          function p2(n) {
            return String(n).padStart(2, "0");
          }
          var hs = h < 100 ? p2(h) : String(h);
          return hs + ":" + p2(m) + ":" + p2(secR);
        }

        /** 다음 브레이크 행까지: 현재 구간 남은 시간 + 중간 전체 구간(레벨·브레이크) 풀타임 합 */
        function secondsUntilNextBreakRow(levels, levelIndex, remCurrentSec) {
          if (!levels || !levels.length) return null;
          var n = levels.length;
          var i = Math.max(0, Math.min(Math.floor(Number(levelIndex)) || 0, n - 1));
          var b = -1;
          for (var j = i + 1; j < n; j++) {
            if (MetisTimer.isBreakRow(levels[j])) {
              b = j;
              break;
            }
          }
          if (b < 0) return null;
          var total = Math.max(0, Math.floor(Number(remCurrentSec) || 0));
          for (var k = i + 1; k < b; k++) {
            total += MetisTimer.levelDurationSec(levels[k]);
          }
          return total;
        }

        function formatDurationHMS(totalSec) {
          var sec = Math.max(0, Math.floor(Number(totalSec) || 0));
          var h = Math.floor(sec / 3600);
          var m = Math.floor((sec % 3600) / 60);
          var secR = sec % 60;
          function p2(x) {
            return String(x).padStart(2, "0");
          }
          var hs = h < 100 ? p2(h) : String(h);
          return hs + ":" + p2(m) + ":" + p2(secR);
        }

        function formatAvgStackParts(avgStack, levelRow) {
          var avgNum = Math.max(0, Math.floor(Number(avgStack) || 0));
          var avgText = avgNum.toLocaleString("ko-KR");
          var bb = levelRow ? Math.floor(Number(levelRow.bb) || 0) : 0;
          var bbLabel = !bb
            ? "(— BB)"
            : "(" + (Math.round((avgNum / bb) * 10) / 10).toFixed(1) + " BB)";
          return { avgText: avgText, bbLabel: bbLabel };
        }

        /** REG CLOSE·NEXT BREAK는 본 타이머(레벨 진행) 중에만 카운트. 대기·시작 준비 bridge 중에는 정지 */
        function shouldRunScheduleClocks(s, tn) {
          if (!s || !tn) return false;
          if (tn.bridge && (tn.bridge.kind === "preWait" || tn.bridge.kind === "startGo")) {
            return false;
          }
          if (
            s.pendingBridge &&
            (s.pendingBridge.kind === "preWait" || s.pendingBridge.kind === "startGo")
          ) {
            return false;
          }
          return true;
        }

        function getActivePresetFromState(s) {
          if (!s || !s.presets) return null;
          if (MetisTimer.getActivePreset) return MetisTimer.getActivePreset(s);
          var aid =
            (MetisTimer.getSyncPresetId && MetisTimer.getSyncPresetId()) ||
            s.activePresetId;
          if (!aid) return null;
          var sid = String(aid);
          for (var i = 0; i < s.presets.length; i++) {
            if (s.presets[i] && String(s.presets[i].id) === sid) return s.presets[i];
          }
          return null;
        }

        function resolveEntryChipsForState(s) {
          if (MetisTimer.resolveActiveEntryChips) {
            return MetisTimer.resolveActiveEntryChips(s);
          }
          var preset = getActivePresetFromState(s);
          if (preset && preset.entryChips !== undefined) {
            return Math.max(0, Math.floor(Number(preset.entryChips) || 0));
          }
          return Math.max(0, Math.floor(Number(s && s.entryChips) || 0));
        }

        function secondsUntilScheduleRowEnd(levels, scheduleIndex, remSec, targetIdx) {
          if (targetIdx == null || targetIdx < 0) return 0;
          var n = levels.length;
          var i = Math.max(0, Math.min(Math.floor(Number(scheduleIndex)) || 0, n - 1));
          var rem = Math.max(0, Math.floor(Number(remSec) || 0));
          if (i > targetIdx) return 0;
          if (i === targetIdx) return rem;
          var total = rem;
          for (var k = i + 1; k <= targetIdx; k++) {
            total += MetisTimer.levelDurationSec(levels[k]);
          }
          return total;
        }

        /**
         * 레지 마감 N = LEVEL N 블라인드가 시작되기 직전 =
         * 그 직전 스케줄 행(레벨 또는 브레이크)이 끝날 때까지.
         */
        function secondsUntilRegCloseBeforeNthPlayLevel(
          levels,
          scheduleIndex,
          remSec,
          closeAfterPlayLevel
        ) {
          if (closeAfterPlayLevel == null || closeAfterPlayLevel < 1) return null;
          var startIdx = MetisTimer.findNthPlayLevelRowIndex(levels, closeAfterPlayLevel);
          if (startIdx == null) return null;
          var deadlineIdx = startIdx - 1;
          return secondsUntilScheduleRowEnd(levels, scheduleIndex, remSec, deadlineIdx);
        }

        function applyRegCloseDisplay(el, s, levels, idxSchedule, rem, now, active) {
          if (!el) return;
          var cacheId = el.id || "el-m-regclose";
          var preset = getActivePresetFromState(s);
          var pl =
            preset && preset.regCloseAfterPlayLevel != null
              ? Math.floor(Number(preset.regCloseAfterPlayLevel))
              : 0;
          var nextText = "—";
          var placeholder = true;
          if (active !== false && pl >= 1 && levels && levels.length) {
            var sec = secondsUntilRegCloseBeforeNthPlayLevel(levels, idxSchedule, rem, pl);
            if (sec == null) {
              nextText = "—";
              placeholder = true;
            } else if (sec <= 0) {
              nextText = "CLOSER";
              placeholder = false;
            } else {
              nextText = formatDurationHMS(sec);
              placeholder = false;
            }
          }
          if (lastUi[cacheId] === nextText && lastUi[cacheId + ":ph"] === placeholder) return;
          lastUi[cacheId] = nextText;
          lastUi[cacheId + ":ph"] = placeholder;
          el.textContent = nextText;
          el.classList.toggle("metric-val--placeholder", placeholder);
        }

        var lastSeenUpdated = 0;
        var prevBridgeSecExact = null;
        var prevLevelSecExact = null;
        var transitionTickMarks = {};
        var bridgeTickMarks = {};
        var audioUnlockBound = false;
        var lastActiveBridgeKind = null;
        var lastDoorongAt = 0;

        function resetTransitionCues() {
          transitionTickMarks = {};
        }

        function crossedThreshold(prevSec, curSec, threshold) {
          if (curSec == null) return false;
          if (prevSec == null) return curSec <= threshold;
          return prevSec > threshold && curSec <= threshold;
        }

        /** 6초 전 음성 → 3·2·1초 띵 (공통 시퀀스) */
        function runTransitionCues(prevSec, curSec, markStore, idPrefix, config) {
          if (curSec == null || typeof MetisAudio === "undefined") return;
          MetisAudio.unlock();
          var voiceAt = config.voiceAt;
          if (voiceAt != null && typeof config.speak === "function") {
            var vKey = idPrefix + "-voice";
            if (!markStore[vKey] && crossedThreshold(prevSec, curSec, voiceAt)) {
              markStore[vKey] = true;
              MetisAudio.ensureCtx();
              config.speak();
            }
          }
          var tickHi = config.tickHi != null ? config.tickHi : 3;
          var tickLo = config.tickLo != null ? config.tickLo : 1;
          for (var t = tickHi; t >= tickLo; t--) {
            var tKey = idPrefix + "-t" + t;
            if (!markStore[tKey] && crossedThreshold(prevSec, curSec, t)) {
              markStore[tKey] = true;
              MetisAudio.ensureCtx();
              MetisAudio.playTick();
            }
          }
        }

        function playTransitionDoorong() {
          if (typeof MetisAudio === "undefined") return;
          var nowMs = Date.now();
          if (nowMs - lastDoorongAt < 800) return;
          lastDoorongAt = nowMs;
          MetisAudio.unlock();
          MetisAudio.ensureCtx();
          MetisAudio.playDoorong();
        }

        function runBridgeTicks(step, prevBridgeSec, curBridgeSec) {
          var br = step.state.timer && step.state.timer.bridge;
          if (!br || typeof MetisAudio === "undefined") return;
          if (br.kind === "preWait") {
            runTransitionCues(prevBridgeSec, curBridgeSec, bridgeTickMarks, "pw", {
              voiceAt: 6,
              speak: function () {
                MetisAudio.speakGameStart();
              },
              tickHi: 3,
              tickLo: 1,
            });
          } else if (br.kind === "startGo") {
            runTransitionCues(prevBridgeSec, curBridgeSec, bridgeTickMarks, "sg", {
              tickHi: 3,
              tickLo: 1,
            });
          }
        }

        function runBlindsUpSequence(step, prevLevelSec, curLevelSec) {
          var s = step.state;
          var t = MetisTimer.normalizeTimer(s.timer || {}, s);
          if (t.bridge || !t.isRunning || typeof MetisAudio === "undefined") return;
          var levels = MetisTimer.getActiveLevels(s);
          if (!levels) return;
          var idx = t.levelIndex;
          var L = levels[idx];
          var NL = levels[idx + 1];
          if (!L || MetisTimer.isBreakRow(L)) return;
          if (!NL) return;
          var toBreak = MetisTimer.isBreakRow(NL);
          var prefix = (toBreak ? "br-" : "lv-") + idx;
          runTransitionCues(prevLevelSec, curLevelSec, transitionTickMarks, prefix, {
            voiceAt: 6,
            speak: function () {
              if (toBreak) MetisAudio.speakBreakTime();
              else MetisAudio.speakNextLevelBlindsUp();
            },
            tickHi: 3,
            tickLo: 1,
          });
        }

        function setClockDisplay(rem) {
          var v = MetisTimer.formatMMSS(rem);
          var el = $("el-clock");
          if (el) el.textContent = v;
          lastUi["el-clock"] = v;
        }

        function renderView(step) {
          var s = step.state;
          var rem = step.rem;
          var tNow =
            typeof step.now === "number"
              ? step.now
              : MetisTimer.now
                ? MetisTimer.now()
                : Date.now();

          setClockDisplay(rem);
          textIf("el-title", s.tournamentName || "토너먼트");

          var levels = MetisTimer.getActiveLevels(s);
          var tn = MetisTimer.normalizeTimer(s.timer || {}, s);
          var inPreWait =
            !!(tn.bridge && tn.bridge.kind === "preWait") ||
            !!(s.pendingBridge && s.pendingBridge.kind === "preWait");

          var paused = (s.timerStatus || "") === "일시정지";
          var ended = (s.timerStatus || "") === "종료";
          var showOverlay = paused || ended;
          var ov = $("pause-overlay");
          var ovLabel = ov
            ? ov.querySelector(".timer-pause-overlay-label")
            : null;
          var overlayKey = ended ? "ended" : paused ? "paused" : "off";
          if (ov && lastPausedOverlay !== overlayKey) {
            lastPausedOverlay = overlayKey;
            ov.classList.toggle("is-visible", showOverlay);
            ov.setAttribute("aria-hidden", showOverlay ? "false" : "true");
            if (ovLabel) {
              ovLabel.textContent = ended ? "종료" : "Ⅱ PAUSED";
            }
          }

          htmlIf("el-prize", displayPrizeBlockHtml(s));
          textIf("el-total-prize", displayTotalPrize(s));
          syncLeftCarousel(s);
          var info = (s.tournamentInfo && String(s.tournamentInfo).trim()) || "";
          textIf("el-tourney-info", info ? info : "—");
          var stageLeft = $("stage-left");
          if (stageLeft) {
            var legacyLs =
              s.leftFontScale != null ? Number(s.leftFontScale) : 1;
            if (!Number.isFinite(legacyLs)) legacyLs = 1;
            legacyLs = Math.min(2, Math.max(0.5, legacyLs));
            var infoRaw =
              s.infoFontScale != null ? Number(s.infoFontScale) : legacyLs;
            var prizeRaw =
              s.prizeFontScale != null ? Number(s.prizeFontScale) : legacyLs;
            var infoFs = Number.isFinite(infoRaw)
              ? Math.min(2, Math.max(0.5, infoRaw))
              : legacyLs;
            var prizeFs = Number.isFinite(prizeRaw)
              ? Math.min(2, Math.max(0.5, prizeRaw))
              : legacyLs;
            if (lastUi.infoFontScale !== infoFs) {
              lastUi.infoFontScale = infoFs;
              stageLeft.style.setProperty("--info-font-scale", String(infoFs));
            }
            if (lastUi.prizeFontScale !== prizeFs) {
              lastUi.prizeFontScale = prizeFs;
              stageLeft.style.setProperty("--prize-font-scale", String(prizeFs));
            }
          }

          var maxLi = levels && levels.length ? levels.length - 1 : 0;
          var li = Math.max(0, Math.min(tn.levelIndex, maxLi));
          var L = levels && levels[li];
          var NL = levels && levels[li + 1];

          if (inPreWait) {
            textIf("el-level", "대기중");
            htmlIf("el-blinds", "");
          } else if (L) {
            if (MetisTimer.isBreakRow(L)) {
              textIf("el-level", "BREAK TIME");
              htmlIf("el-blinds", "");
            } else {
              textIf("el-level", "LEVEL " + MetisTimer.playLevelsCountUpTo(levels, li));
              htmlIf(
                "el-blinds",
                '<span class="lab">BLINDS</span> ' +
                  L.sb +
                  " / " +
                  L.bb +
                  ' &nbsp; <span class="lab">ANTE</span> ' +
                  (L.ante != null ? L.ante : 0)
              );
            }
          } else {
            textIf("el-level", "LEVEL —");
            textIf("el-blinds", "프리셋을 선택해 주세요.");
          }

          var preGameNextPreview =
            inPreWait ||
            !!(tn.bridge && tn.bridge.kind === "startGo") ||
            !!(
              s.pendingBridge &&
              (s.pendingBridge.kind === "preWait" || s.pendingBridge.kind === "startGo")
            ) ||
            !s.hasStartedOnce;

          if (preGameNextPreview && levels && levels.length) {
            var fpRow = firstPlayLevelRow(levels);
            if (fpRow) {
              htmlIf(
                "el-next",
                "<strong>NEXT LEVEL 1</strong> — " +
                  fpRow.sb +
                  "/" +
                  fpRow.bb +
                  " (" +
                  (fpRow.ante != null ? fpRow.ante : 0) +
                  ")"
              );
            } else {
              htmlIf("el-next", "");
            }
          } else if (NL) {
            if (MetisTimer.isBreakRow(NL)) {
              var bm = Number(NL.minutes);
              if (!Number.isFinite(bm)) bm = 0;
              htmlIf("el-next", "<strong>NEXT BREAK</strong> — 약 " + bm + "분");
            } else {
              var nextOrd = MetisTimer.playLevelsCountUpTo(levels, li + 1);
              htmlIf(
                "el-next",
                "<strong>NEXT LEVEL " +
                  nextOrd +
                  "</strong> — " +
                  NL.sb +
                  "/" +
                  NL.bb +
                  " (" +
                  (NL.ante != null ? NL.ante : 0) +
                  ")"
              );
            }
          } else if (L && levels && li + 1 >= levels.length) {
            htmlIf("el-next", "<strong>마지막 단계</strong>");
          } else {
            htmlIf("el-next", "");
          }

          var pl = s.player != null ? s.player : 0;
          var en = s.entry != null ? s.entry : 0;
          textIf("el-m-players", pl + " / " + en);
          var idxSchedule = tn.levelIndex;
          if (shouldRunScheduleClocks(s, tn)) {
            applyRegCloseDisplay($("el-m-regclose"), s, levels, idxSchedule, rem, tNow, true);
          } else {
            applyRegCloseDisplay($("el-m-regclose"), s, levels, idxSchedule, rem, tNow, false);
          }
          var totalStack =
            Math.max(0, Math.floor(Number(en) || 0)) * resolveEntryChipsForState(s);
          textIf("el-m-total", totalStack.toLocaleString("ko-KR"));
          var avgStack = pl > 0 ? Math.floor(totalStack / pl) : 0;
          var avgParts = formatAvgStackParts(avgStack, L);
          textIf("el-m-avg", avgParts.avgText);
          textIf("el-m-avg-bb", avgParts.bbLabel);

          var scheduleClocksOn = shouldRunScheduleClocks(s, tn);
          var secToBreak = scheduleClocksOn
            ? secondsUntilNextBreakRow(levels, idxSchedule, rem)
            : null;
          var elNb = $("el-m-nextbreak");
          if (elNb) {
            var nbKey = "el-m-nextbreak";
            var nbText;
            var nbPh;
            if (secToBreak == null) {
              nbText = "—";
              nbPh = true;
            } else {
              nbText = formatDurationHMS(secToBreak);
              nbPh = false;
            }
            if (lastUi[nbKey] !== nbText || lastUi[nbKey + ":ph"] !== nbPh) {
              lastUi[nbKey] = nbText;
              lastUi[nbKey + ":ph"] = nbPh;
              elNb.textContent = nbText;
              elNb.classList.toggle("metric-val--placeholder", nbPh);
            }
          }

          lastSeenUpdated = s.updatedAt || lastSeenUpdated;

          var tmr = s.timer && s.timer.isRunning;
          syncBreakUi(
            !!(L && MetisTimer.isBreakRow(L)),
            L && MetisTimer.isBreakRow(L) ? L : null,
            rem,
            !!tmr,
            levels,
            li
          );
        }

        function tick() {
          var hbNow = Date.now();
          if (hbNow - lastHeartbeatAt >= MetisTimer.HEARTBEAT_MS) {
            MetisTimer.touchTimerWindowHeartbeat();
            lastHeartbeatAt = hbNow;
          }
          var prevBridge = prevBridgeSecExact;
          var prevLevel = prevLevelSecExact;
          var step = MetisTimer.engineStep();
          if (!step) return;
          var nowMs =
            typeof step.now === "number"
              ? step.now
              : MetisTimer.now
                ? MetisTimer.now()
                : Date.now();
          var tNow = step.state.timer ? step.state.timer : null;
          var curBridgeSec =
            tNow && tNow.bridge && Number.isFinite(Number(tNow.bridge.until))
              ? (Number(tNow.bridge.until) - nowMs) / 1000
              : null;
          var curLevelSec =
            tNow &&
            tNow.isRunning &&
            tNow.endAt != null &&
            Number.isFinite(Number(tNow.endAt))
              ? (Number(tNow.endAt) - nowMs) / 1000
              : null;

          var brActive = !!(step.state.timer && step.state.timer.bridge);
          if (!brActive) {
            bridgeTickMarks = {};
          }

          if (step.bridgeCompleted && typeof MetisAudio !== "undefined") {
            bridgeTickMarks = {};
            playTransitionDoorong();
          }

          var curBridgeKind =
            step.state.timer && step.state.timer.bridge
              ? step.state.timer.bridge.kind
              : null;
          if (
            (lastActiveBridgeKind === "preWait" || lastActiveBridgeKind === "startGo") &&
            !curBridgeKind &&
            step.state.timer &&
            step.state.timer.isRunning &&
            (step.state.timerStatus || "") === "진행중" &&
            !step.bridgeCompleted
          ) {
            playTransitionDoorong();
          }
          lastActiveBridgeKind = curBridgeKind;

          if (step.leveledUp) {
            resetTransitionCues();
            playTransitionDoorong();
            prevLevelSecExact = null;
          }

          runBridgeTicks(step, prevBridge, curBridgeSec);
          runBlindsUpSequence(step, prevLevel, curLevelSec);

          if (brActive) {
            prevBridgeSecExact = curBridgeSec;
          } else {
            prevBridgeSecExact = null;
          }
          prevLevelSecExact = curLevelSec;
          renderView(step);
        }

        function refreshFromBroadcast() {
          var s = MetisTimer.readSyncState();
          if (!s) return;
          var now = MetisTimer.now ? MetisTimer.now() : Date.now();
          var rem = MetisTimer.remainingSec(s, now);
          renderView({ state: s, rem: rem, now: now });
        }

        // Firestore applyTimerControl 직후 UI 강제 갱신
        window.addEventListener("metis-timer-control-applied", function (ev) {
          lastUi = {};
          lastPausedOverlay = null;
          refreshFromBroadcast();
          var detail = ev && ev.detail ? ev.detail : null;
          if (detail && detail.leveledUp) {
            resetTransitionCues();
            playTransitionDoorong();
            prevLevelSecExact = null;
          }
          tick();
        });

        function togglePauseResume() {
          var s = MetisTimer.readSyncState();
          if (!s) return;
          if (typeof MetisAudio !== "undefined") {
            MetisAudio.unlock();
            if (MetisAudio.resumeCtx) MetisAudio.resumeCtx();
          }
          var t = MetisTimer.normalizeTimer(s.timer, s);
          if (t.isRunning || t.bridge) {
            MetisTimer.applyPause(s, MetisTimer.now ? MetisTimer.now() : Date.now());
          } else {
            try {
              var ctx = new (window.AudioContext || window.webkitAudioContext)();
              ctx.resume().catch(function () {});
            } catch (e) {}
            MetisTimer.applyStartOrResume(
              s,
              MetisTimer.now ? MetisTimer.now() : Date.now()
            );
          }
          MetisTimer.writeSyncState(s, {
            skipPresetEmbed: true,
            userAction: true,
            urgentCloudPush: true,
          });
          tick();
        }

        var tapRoot = $("tap-root");
        var quickPanel = $("quick-panel");
        var quickHoverBottom = false;
        var quickHoverPanel = false;
        var QUICK_VOL_KEY = "metis_quick_master_volume";
        var MIN_QUICK_VOLUME = 0.35;
        var DEFAULT_QUICK_VOLUME = 1;
        var BREAK_VIDEO_VOL_KEY = "metis_break_video_volume";
        var DEFAULT_BREAK_VIDEO_VOLUME = 0.65;
        var breakVideoUserVolume = DEFAULT_BREAK_VIDEO_VOLUME;
        var breakVideoUserMuted = false;
        var breakVideoAudioSyncing = false;

        function normalizeQuickVolume(raw) {
          var n = Number(raw);
          if (!Number.isFinite(n) || n <= 0) return DEFAULT_QUICK_VOLUME;
          return Math.max(MIN_QUICK_VOLUME, Math.min(1, n));
        }

        function clampBreakVideoVolume(raw) {
          var n = Number(raw);
          if (!Number.isFinite(n)) return DEFAULT_BREAK_VIDEO_VOLUME;
          return Math.max(0, Math.min(1, n));
        }

        function persistBreakVideoAudio() {
          try {
            localStorage.setItem(
              BREAK_VIDEO_VOL_KEY,
              JSON.stringify({
                volume: breakVideoUserVolume,
                muted: breakVideoUserMuted,
              })
            );
          } catch (e) {}
        }

        function loadBreakVideoVolume() {
          try {
            var raw = localStorage.getItem(BREAK_VIDEO_VOL_KEY);
            if (raw == null || raw === "") return;
            if (raw.charAt(0) === "{") {
              var parsed = JSON.parse(raw);
              breakVideoUserVolume = clampBreakVideoVolume(parsed.volume);
              breakVideoUserMuted = !!parsed.muted;
              return;
            }
            breakVideoUserVolume = clampBreakVideoVolume(raw);
          } catch (e) {}
        }

        function applyBreakVideoAudio(vid) {
          if (!vid) return;
          breakVideoAudioSyncing = true;
          try {
            vid.volume = breakVideoUserVolume;
            vid.muted = breakVideoUserMuted;
          } catch (e) {}
          breakVideoAudioSyncing = false;
        }

        function bindBreakVideoVolumeControls(vid) {
          if (!vid || vid.dataset.metisVolBound) return;
          vid.dataset.metisVolBound = "1";
          function stopVideoBubble(e) {
            e.stopPropagation();
          }
          vid.addEventListener("click", stopVideoBubble);
          vid.addEventListener("pointerdown", stopVideoBubble);
          vid.addEventListener("pointerup", stopVideoBubble);
          vid.addEventListener("mousedown", stopVideoBubble);
          vid.addEventListener("mouseup", stopVideoBubble);
          vid.addEventListener("volumechange", function () {
            if (breakVideoAudioSyncing) return;
            breakVideoUserVolume = clampBreakVideoVolume(vid.volume);
            breakVideoUserMuted = !!vid.muted;
            persistBreakVideoAudio();
          });
        }

        function playBreakVideo(vid) {
          if (!vid) return;
          bindBreakVideoVolumeControls(vid);
          if (!breakVideoAudioApplied) {
            applyBreakVideoAudio(vid);
            breakVideoAudioApplied = true;
          }
          var p = vid.play();
          if (p && typeof p.then === "function") {
            p.catch(function () {
              breakVideoAudioSyncing = true;
              try {
                vid.muted = true;
              } catch (eMute) {}
              breakVideoAudioSyncing = false;
              var p2 = vid.play();
              if (p2 && typeof p2.then === "function") {
                p2.then(function () {
                  if (breakVideoUserMuted) return;
                  breakVideoAudioSyncing = true;
                  try {
                    vid.muted = false;
                  } catch (eUnmute) {}
                  breakVideoAudioSyncing = false;
                }).catch(function () {});
              }
            });
          }
        }

        function refreshQuickPanelVisibility() {
          if (!quickPanel) return;
          quickPanel.classList.toggle("is-visible", quickHoverBottom || quickHoverPanel);
        }

        function volumeToPercent(v) {
          return Math.round(normalizeQuickVolume(v) * 100);
        }

        function updateVolLabel(v) {
          var label = $("quick-vol-label");
          if (!label) return;
          label.textContent = "VOL (" + volumeToPercent(v) + "%)";
        }

        function setQuickMasterVolume(v) {
          var val = normalizeQuickVolume(v);
          if (typeof MetisAudio !== "undefined" && MetisAudio.setMasterVolume) {
            MetisAudio.setMasterVolume(val);
          }
          try {
            localStorage.setItem(QUICK_VOL_KEY, String(val));
          } catch (e) {}
          updateVolLabel(val);
        }

        function getQuickMasterVolume() {
          if (typeof MetisAudio !== "undefined" && MetisAudio.getMasterVolume) {
            return MetisAudio.getMasterVolume();
          }
          return 1;
        }

        function adjustQuickMasterVolume(delta) {
          var pct = volumeToPercent(getQuickMasterVolume());
          var step = Math.round(delta * 100);
          if (pct % 10 !== 0) {
            pct = delta > 0 ? Math.ceil(pct / 10) * 10 : Math.floor(pct / 10) * 10;
          } else {
            pct += step;
          }
          setQuickMasterVolume(pct / 100);
        }

        function loadQuickVolume() {
          var init = DEFAULT_QUICK_VOLUME;
          try {
            var raw = localStorage.getItem(QUICK_VOL_KEY);
            init = normalizeQuickVolume(raw);
            if (raw === "0" || Number(raw) <= 0) {
              localStorage.setItem(QUICK_VOL_KEY, String(init));
            }
          } catch (e) {}
          setQuickMasterVolume(init);
        }

        function quickFeedback() {
          if (navigator.vibrate) navigator.vibrate(10);
        }

        function mutateSync(mutator, options) {
          options = options || {};
          var s = MetisTimer.readSyncState();
          if (!s) {
            console.log("[MetisSync|PUSH|mutateSync:state없음] (timer.html)");
            return;
          }
          var before = {
            player: s.player,
            entry: s.entry,
            statsUpdatedAt: s.statsUpdatedAt,
          };
          mutator(s, MetisTimer.now ? MetisTimer.now() : Date.now());
          console.log("[MetisSync|PUSH|mutateSync:변경] (timer.html)", {
            before: before,
            after: { player: s.player, entry: s.entry },
            options: options,
          });
          MetisTimer.writeSyncState(s, {
            skipPresetEmbed: true,
            userAction: true,
            bumpStats: !!options.bumpStats,
            urgentCloudPush: !!options.urgentCloudPush,
            levelMutation: options.levelMutation,
          });
          refreshFromBroadcast();
        }

        function adjustCurrentRemaining(deltaSec) {
          mutateSync(function (s, now) {
            var t = MetisTimer.normalizeTimer(s.timer || {}, s);
            s.timer = t;
            if (t.bridge && Number.isFinite(Number(t.bridge.until))) {
              t.bridge.until = Math.max(now, Number(t.bridge.until) + deltaSec * 1000);
              var remBridge = MetisTimer.remainingSec(s, now);
              s.displayTime = MetisTimer.formatMMSS(remBridge);
              delete lastUi["el-clock"];
              delete lastUi["break-remaining-top"];
              prevBridgeSecExact = null;
              return;
            }
            if (t.isRunning) {
              if (t.endAt == null || !Number.isFinite(t.endAt)) {
                var bootRem = Math.max(0, Math.floor(t.pausedRemainingSec || 0));
                t.endAt = now + bootRem * 1000;
              }
              t.endAt = Math.max(now, Number(t.endAt) + deltaSec * 1000);
              t.pausedRemainingSec = MetisTimer.remainingSec(s, now);
            } else {
              var paused = Math.max(0, Math.floor(Number(t.pausedRemainingSec) || 0));
              var nextPaused = Math.max(0, paused + deltaSec);
              t.endAt = null;
              t.pausedRemainingSec = nextPaused;
            }
            s.displayTime = MetisTimer.formatMMSS(MetisTimer.remainingSec(s, now));
            delete lastUi["el-clock"];
            delete lastUi["break-remaining-top"];
            prevLevelSecExact = null;
          }, { urgentCloudPush: true });
          tick();
        }

        function adjustLevel(delta) {
          mutateSync(function (s, now) {
            MetisTimer.applyScheduleLevelDelta(s, now, delta);
          }, { urgentCloudPush: true, levelMutation: "manual" });
        }

        function quickStart() {
          mutateSync(function (s, now) {
            if (typeof MetisAudio !== "undefined") {
              MetisAudio.unlock();
              if (MetisAudio.resumeCtx) MetisAudio.resumeCtx();
            }
            var t = MetisTimer.normalizeTimer(s.timer || {}, s);
            if (MetisTimer.isEffectivelyRunningTimer(t, now)) return;
            MetisTimer.applyStartOrResume(s, now);
          }, { urgentCloudPush: true });
        }

        function quickPause() {
          mutateSync(function (s, now) {
            MetisTimer.applyPause(s, now);
          }, { urgentCloudPush: true });
        }

        function quickEnd() {
          mutateSync(function (s) {
            var levels = MetisTimer.getActiveLevels(s);
            s.timer = MetisTimer.defaultTimer();
            s.pendingBridge = null;
            s.hasStartedOnce = false;
            s.timerStatus = "대기중";
            s.regCloseAt = null;
            s.level = 1;
            if (levels && levels.length) {
              s.timer.levelIndex = 0;
              s.timer.pausedRemainingSec = MetisTimer.levelDurationSec(levels[0]);
              s.displayTime = MetisTimer.formatMMSS(s.timer.pausedRemainingSec);
            } else {
              s.displayTime = "00:00";
            }
          }, { urgentCloudPush: true });
        }

        function adjustEntry(delta) {
          console.log("[MetisSync|PUSH|adjustEntry] (timer.html)", { delta: delta });
          mutateSync(function (s) {
            // 활성 프리셋 ID의 바인칩만 사용 (다른 프리셋 값 잔존 방지)
            s.entryChips = resolveEntryChipsForState(s);
            var e = Math.max(0, Math.floor(Number(s.entry) || 0));
            var p = Math.max(0, Math.floor(Number(s.player) || 0));
            if (delta > 0) {
              s.entry = e + 1;
              s.player = p + 1;
            } else {
              s.entry = Math.max(0, e - 1);
              s.player = Math.min(p, s.entry);
            }
          }, { bumpStats: true, urgentCloudPush: true });
        }

        function adjustPlayer(delta) {
          console.log("[MetisSync|PUSH|adjustPlayer] (timer.html)", { delta: delta });
          mutateSync(function (s) {
            var e = Math.max(0, Math.floor(Number(s.entry) || 0));
            var p = Math.max(0, Math.floor(Number(s.player) || 0));
            if (delta > 0) s.player = Math.min(e, p + 1);
            else s.player = Math.max(0, p - 1);
          }, { bumpStats: true, urgentCloudPush: true });
        }

        function handleQuickAction(action) {
          if (typeof MetisAudio !== "undefined") {
            MetisAudio.unlock();
            if (MetisAudio.resumeCtx) MetisAudio.resumeCtx();
          }
          quickFeedback();
          if (action === "vol-plus") return adjustQuickMasterVolume(0.1);
          if (action === "vol-minus") return adjustQuickMasterVolume(-0.1);
          if (action === "entry-plus") return adjustEntry(1);
          if (action === "entry-minus") return adjustEntry(-1);
          if (action === "player-plus") return adjustPlayer(1);
          if (action === "player-minus") return adjustPlayer(-1);
          if (action === "level-plus") return adjustLevel(1);
          if (action === "level-minus") return adjustLevel(-1);
          if (action === "min-plus") return adjustCurrentRemaining(60);
          if (action === "min-minus") return adjustCurrentRemaining(-60);
          if (action === "sec-plus") return adjustCurrentRemaining(1);
          if (action === "sec-minus") return adjustCurrentRemaining(-1);
          if (action === "start") return quickStart();
          if (action === "pause") return quickPause();
          if (action === "end") return quickEnd();
        }

        function bindAudioUnlockOnce() {
          if (audioUnlockBound || typeof MetisAudio === "undefined") return;
          audioUnlockBound = true;
          function onceUnlock() {
            MetisAudio.unlock();
            if (MetisAudio.resumeCtx) MetisAudio.resumeCtx();
          }
          window.addEventListener("pointerdown", onceUnlock, true);
          window.addEventListener("keydown", onceUnlock, true);
          window.addEventListener("touchstart", onceUnlock, true);
          window.addEventListener("click", onceUnlock, true);
        }
        bindAudioUnlockOnce();
        if (typeof MetisAudio !== "undefined") MetisAudio.unlock();
        loadQuickVolume();
        loadBreakVideoVolume();
        refreshQuickPanelVisibility();
        window.addEventListener("mousemove", function (e) {
          var bottomBand = 50;
          quickHoverBottom = window.innerHeight - e.clientY <= bottomBand;
          refreshQuickPanelVisibility();
        });
        if (quickPanel) {
          quickPanel.addEventListener("mouseenter", function () {
            quickHoverPanel = true;
            refreshQuickPanelVisibility();
          });
          quickPanel.addEventListener("mouseleave", function () {
            quickHoverPanel = false;
            refreshQuickPanelVisibility();
          });
        }
        if (quickPanel) {
          quickPanel.addEventListener("click", function (e) {
            var t = e.target;
            if (!(t instanceof HTMLButtonElement)) return;
            var action = t.getAttribute("data-quick");
            if (action) handleQuickAction(action);
          });
        }
        tapRoot.addEventListener("click", function () {
          if (typeof MetisAudio !== "undefined") MetisAudio.unlock();
          togglePauseResume();
        });
        tapRoot.addEventListener("keydown", function (e) {
          if (e.key === " " || e.key === "Enter") {
            e.preventDefault();
            if (typeof MetisAudio !== "undefined") MetisAudio.unlock();
            togglePauseResume();
          }
        });

        setInterval(tick, MAIN_TICK_MS);

        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "hidden") {
            MetisTimer.touchTimerWindowHeartbeat();
            return;
          }
          lastHeartbeatAt = 0;
          lastUi = {};
          tick();
        });

        MetisTimer.subscribeSync(refreshFromBroadcast);
        window.addEventListener("storage", refreshFromBroadcast);
        window.addEventListener("metis-presets-bootstrapped", refreshFromBroadcast);
        window.addEventListener("metis-presets-remote-applied", function () {
          if (
            MetisTimer.syncAllPresetsMetadataFromStorage
          ) {
            MetisTimer.syncAllPresetsMetadataFromStorage();
          }
          lastUi = {};
          refreshFromBroadcast();
        });
        window.addEventListener("metis-clock-synced", function () {
          refreshFromBroadcast();
          tick();
        });

        if (
          window.MetisFirestoreSync &&
          MetisFirestoreSync.bindCloudSyncBadge
        ) {
          MetisFirestoreSync.bindCloudSyncBadge("cloud-sync-badge");
        }

        function startFirestoreBuyInOnTimer() {
          if (!window.MetisFirestoreSync) return;
          var buyInPid = MetisTimer.getSyncPresetId
            ? MetisTimer.getSyncPresetId()
            : window.__METIS_TIMER_PRESET_ID || "";
          if (!buyInPid) return;
          console.log("[MetisFirestore|PULL|timer.html:startLiveSync]", {
            presetId: buyInPid,
          });
          var startFn =
            MetisFirestoreSync.startLiveSync || MetisFirestoreSync.startBuyInSync;
          startFn.call(MetisFirestoreSync, buyInPid, function (info) {
            refreshFromBroadcast();
            if (
              info &&
              info.source === "timerControl" &&
              info.result &&
              info.result.leveledUp
            ) {
              resetTransitionCues();
              playTransitionDoorong();
              prevLevelSecExact = null;
            }
            tick();
          });
        }
        if (window.MetisFirestoreSync) startFirestoreBuyInOnTimer();
        else {
          window.addEventListener(
            "metis-firebase-ready",
            startFirestoreBuyInOnTimer,
            { once: true }
          );
        }

        function clearHb() {
          if (MetisTimer.clearTimerWindowHeartbeat) {
            MetisTimer.clearTimerWindowHeartbeat();
            return;
          }
          try {
            localStorage.removeItem(MetisTimer.getHeartbeatStorageKey());
          } catch (e0) {}
          try {
            localStorage.removeItem(MetisTimer.HEARTBEAT_KEY);
          } catch (e) {}
        }
        function clearLeftCarousel() {
          stopLeftCarousel();
        }
        window.addEventListener("beforeunload", function () {
          clearHb();
          clearLeftCarousel();
        });
        window.addEventListener("pagehide", function (ev) {
          if (ev && ev.persisted) return;
          clearHb();
          clearLeftCarousel();
          if (window.MetisFirestoreSync) {
            if (MetisFirestoreSync.stopAllLiveSync) {
              MetisFirestoreSync.stopAllLiveSync();
            } else if (MetisFirestoreSync.stopBuyInSync) {
              MetisFirestoreSync.stopBuyInSync();
            }
          }
        });

        tick();
        }

        if (window.__METIS_TIMER_BOOT_DONE) runTimerPage();
        else window.addEventListener("metis-timer-boot-done", runTimerPage, { once: true });
      })();
    </script>
  </body>
</html>
